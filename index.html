<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <section class="logo-section">
    <h2>Empresas que inspiram inovação</h2>

    <div class="logo-carousel" role="region" aria-label="Logotipos das empresas">


      <div class="logo-track">

        <!-- Grupo 1 -->
        <div class="logo-group">
          <img src="asserts/github.svg" alt="GitHub" class="git-logo">
          <img src="asserts/spotify.svg" alt="Spotify">
          <img src="asserts/microsoft.svg" alt="Microsoft">
          <img src="asserts/google.svg" alt="Google">
          <img src="asserts/cordas_pampa.svg" alt="Cordas Pampa" class="git-logo">
          <img src="asserts/ibm.svg" alt="ibm" class="git-logo">

        </div>

        <!-- Grupo 2: cópia idêntica do 1 -->
        <div class="logo-group" aria-hidden="true">
          <img src="asserts/github.svg" alt="" class="git-logo">
          <img src="asserts/spotify.svg" alt="">
          <img src="asserts/microsoft.svg" alt="">
          <img src="asserts/google.svg" alt="">
          <img src="asserts/cordas_pampa.svg" alt="" class="git-logo">
          <img src="asserts/ibm.svg" alt="ibm" class="git-logo">
        </div>

      </div>


    </div>
  </section>


</body>

</html>
